[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tycoonle-hud-harness"
version = "0.1.0"
description = "HUD environment and MCP tool harness for TycoonLE logistics planning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp>=2.0",
    "hud-python>=0.6",
    "tycoonle @ git+https://github.com/vrtnis/tycoon-learning-environment.git",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tycoonle_hud*"]
